<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Sector Fundamental Checklist & Matrix</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root, [data-theme="light"] {
      --bg-base: #f4f6f8;
      --bg-surface: #ffffff;
      --bg-surface-elevated: #f1f5f9;
      --bg-category: #e2e8f0;
      --border-subtle: #d5dbe3;
      --border-focus: #2456c9;
      
      --text-main: #1c2430;
      --text-muted: #5d6a7a;
      --text-dim: #7f8b99;
      
      --accent-blue: #2456c9;
      --category-label: #1e3a8a;
      
      --r0-bg: rgba(200, 50, 40, 0.15);
      --r0-text: #b91c1c;
      --r1-bg: rgba(220, 160, 0, 0.18);
      --r1-text: #b45309;
      --r2-bg: rgba(60, 160, 90, 0.16);
      --r2-text: #15803d;
      --r3-bg: rgba(30, 140, 80, 0.28);
      --r3-text: #047857;

      --rank-gold-bg: #fef08a;
      --rank-gold-text: #854d0e;

      --card-shadow: 0 1px 3px rgba(0, 0, 0, 0.05), 0 1px 2px rgba(0, 0, 0, 0.03);
    }

    [data-theme="dark"] {
      --bg-base: #141a22;
      --bg-surface: #1c242f;
      --bg-surface-elevated: #232d3b;
      --bg-category: #2a3747;
      --border-subtle: #33404f;
      --border-focus: #7ea4ff;
      
      --text-main: #e6ebf1;
      --text-muted: #93a0b1;
      --text-dim: #64748b;
      
      --accent-blue: #7ea4ff;
      --category-label: #93c5fd;
      
      --r0-bg: rgba(255, 110, 100, 0.22);
      --r0-text: #f87171;
      --r1-bg: rgba(230, 190, 70, 0.22);
      --r1-text: #fbbf24;
      --r2-bg: rgba(90, 200, 140, 0.2);
      --r2-text: #4ade80;
      --r3-bg: rgba(70, 200, 130, 0.35);
      --r3-text: #34d399;

      --rank-gold-bg: rgba(234, 179, 8, 0.25);
      --rank-gold-text: #fde047;

      --card-shadow: none;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; transition: background-color 0.15s ease, color 0.15s ease; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 20px 24px;
      min-height: 100vh;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border-subtle);
      flex-wrap: wrap;
      gap: 12px;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-icon {
      width: 34px; height: 34px;
      background: linear-gradient(135deg, var(--accent-blue), #38bdf8);
      border-radius: 8px; display: flex; align-items: center; justify-content: center;
      font-weight: 800; color: #ffffff; font-size: 16px; flex-shrink: 0;
    }
    .brand h1 { font-size: 19px; font-weight: 700; letter-spacing: -0.02em; }
    .brand p { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    /* Sector Navigation Bar */
    .sector-nav { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
    .btn-tab {
      background: var(--bg-surface); border: 1px solid var(--border-subtle);
      color: var(--text-main); padding: 7px 14px; border-radius: 6px;
      font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .btn-tab.active { background: var(--accent-blue); color: #fff; border-color: var(--accent-blue); }

    .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .ticker-input-wrap {
      display: flex; background: var(--bg-surface);
      border: 1px solid var(--border-subtle); border-radius: 6px; overflow: hidden;
      box-shadow: var(--card-shadow);
    }
    .period-input {
      background: var(--bg-surface-elevated); border: none; border-right: 1px solid var(--border-subtle);
      padding: 8px 10px; color: var(--text-muted); font-size: 12px; font-weight: 700; outline: none; width: 85px;
    }
    .ticker-input {
      background: transparent; border: none; padding: 8px 12px;
      color: var(--text-main); font-family: 'JetBrains Mono', monospace;
      font-size: 13px; font-weight: 600; text-transform: uppercase; outline: none; width: 120px;
    }
    .btn-add {
      background: var(--accent-blue); border: none; color: #ffffff;
      padding: 0 14px; font-weight: 600; font-size: 13px; cursor: pointer;
    }
    .btn-add:hover { opacity: 0.9; }

    .btn-action {
      background: var(--bg-surface); border: 1px solid var(--border-subtle);
      color: var(--text-main); border-radius: 6px; padding: 8px 12px;
      font-size: 13px; font-weight: 600; cursor: pointer; display: flex;
      align-items: center; gap: 6px; box-shadow: var(--card-shadow);
    }
    .btn-action:hover { border-color: var(--border-focus); }
    .btn-save-cloud { background: #059669; color: #ffffff; border: none; }
    .btn-save-cloud:hover { opacity: 0.9; }
    .btn-load-cloud { background: #0284c7; color: #ffffff; border: none; }
    .btn-load-cloud:hover { opacity: 0.9; }

    /* Table & Matrix Layout */
    .table-container {
      background: var(--bg-surface); border: 1px solid var(--border-subtle);
      border-radius: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch;
      box-shadow: var(--card-shadow);
    }
    table { width: 100%; border-collapse: separate; border-spacing: 0; text-align: left; }
    th, td { padding: 9px 14px; border-bottom: 1px solid var(--border-subtle); white-space: nowrap; }

    thead th {
      background: var(--bg-surface); font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted);
      position: sticky; top: 0; z-index: 2;
    }
    thead th.metric-col { width: 270px; min-width: 250px; border-right: 1px solid var(--border-subtle); }
    thead th.stock-col { min-width: 190px; text-align: center; background: var(--bg-surface-elevated); border-right: 1px solid var(--border-subtle); }
    
    .stock-header-wrap { display: flex; justify-content: space-between; align-items: center; padding: 2px; }
    .stock-meta { display: flex; align-items: center; gap: 8px; text-align: left; }
    .rank-tag {
      font-size: 10px; font-weight: 800; padding: 2px 6px; border-radius: 4px;
      background: var(--bg-surface); color: var(--text-muted); border: 1px solid var(--border-subtle);
    }
    .rank-tag.rank-first { background: var(--rank-gold-bg); color: var(--rank-gold-text); border: none; }
    .stock-symbol { font-size: 13px; font-weight: 700; color: var(--text-main); font-family: 'JetBrains Mono', monospace; }
    .stock-period { font-size: 10px; color: var(--text-dim); font-weight: 600; display: block; }
    .btn-remove { background: transparent; border: none; color: var(--text-dim); font-size: 18px; cursor: pointer; padding: 0 4px; }
    .btn-remove:hover { color: #ef4444; }

    tr.category-row td {
      background: var(--bg-category); font-size: 11px; font-weight: 800;
      color: var(--category-label); text-transform: uppercase; letter-spacing: 0.06em;
      padding: 7px 14px; border-top: 1px solid var(--border-subtle); border-bottom: 1px solid var(--border-subtle);
    }
    td.metric-col { font-size: 12px; font-weight: 600; border-right: 1px solid var(--border-subtle); }
    td.metric-col .metric-desc { font-size: 11px; font-weight: 400; color: var(--text-dim); margin-top: 1px; white-space: normal; max-width: 250px; }

    td.stock-col { text-align: center; border-right: 1px solid var(--border-subtle); padding: 6px 10px; }
    .cell-value-wrap {
      display: inline-flex; align-items: center; justify-content: space-between;
      width: 100%; max-width: 175px; background: var(--bg-surface-elevated);
      border: 1px solid var(--border-subtle); border-radius: 5px; padding: 5px 8px;
    }
    .cell-value { font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; color: var(--text-main); }
    
    /* 4-Level Checklist Rating Badges */
    .badge-r {
      font-size: 9px; font-weight: 800; text-transform: uppercase;
      letter-spacing: 0.03em; padding: 2px 6px; border-radius: 4px;
    }
    .r0 { background: var(--r0-bg); color: var(--r0-text); }
    .r1 { background: var(--r1-bg); color: var(--r1-text); }
    .r2 { background: var(--r2-bg); color: var(--r2-text); }
    .r3 { background: var(--r3-bg); color: var(--r3-text); }

    tr.summary-row td { background: var(--bg-surface-elevated); padding: 12px 14px; border-bottom: 1px solid var(--border-subtle); }
    .score-badge { font-family: 'JetBrains Mono', monospace; font-size: 17px; font-weight: 800; }
    .verdict-tag {
      display: inline-block; font-size: 11px; font-weight: 700; text-transform: uppercase;
      padding: 3px 8px; border-radius: 5px; margin-top: 3px;
    }
    .vd-strong { background: var(--r3-bg); color: var(--r3-text); }
    .vd-decent { background: var(--r2-bg); color: var(--r2-text); }
    .vd-mixed { background: var(--r1-bg); color: var(--r1-text); }
    .vd-weak { background: var(--r0-bg); color: var(--r0-text); }
    .vd-fill { background: var(--bg-category); color: var(--text-muted); }

    .foot-text { margin-top: 14px; color: var(--text-muted); font-size: 12px; line-height: 1.5; max-width: 90ch; }

    /* Modal Sheet Picker */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(15, 23, 42, 0.5); backdrop-filter: blur(3px);
      z-index: 200; display: none; align-items: center; justify-content: center;
      padding: 16px;
    }
    .modal-card {
      background: var(--bg-surface); border: 1px solid var(--border-subtle);
      border-radius: 10px; width: 480px; max-width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.15);
      display: flex; flex-direction: column; max-height: 85vh;
    }
    .modal-header {
      padding: 14px 18px; border-bottom: 1px solid var(--border-subtle);
      display: flex; justify-content: space-between; align-items: center;
    }
    .modal-header h3 { font-size: 15px; font-weight: 700; }
    .modal-actions-bar {
      padding: 8px 18px; background: var(--bg-surface-elevated);
      border-bottom: 1px solid var(--border-subtle); display: flex;
      justify-content: space-between; align-items: center;
    }
    .btn-link {
      background: none; border: none; color: var(--accent-blue);
      font-size: 12px; font-weight: 600; cursor: pointer; text-decoration: underline;
    }
    .stock-list-container {
      padding: 14px 18px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 8px;
    }
    .stock-item-row {
      display: flex; align-items: center; gap: 10px; padding: 8px 10px;
      border-radius: 5px; background: var(--bg-surface-elevated); cursor: pointer;
    }
    .stock-item-row:hover { background: var(--bg-category); }
    .stock-item-row input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent-blue); }
    .modal-footer {
      padding: 12px 18px; border-top: 1px solid var(--border-subtle);
      display: flex; justify-content: flex-end; gap: 8px;
    }

    /* Mobile Responsive Optimizations */
    @media (max-width: 768px) {
      body { padding: 12px 10px; }
      header { flex-direction: column; align-items: stretch; gap: 10px; }
      .sector-nav { overflow-x: auto; padding-bottom: 4px; }
      .controls { flex-direction: column; width: 100%; gap: 8px; }
      .ticker-input-wrap { width: 100%; display: grid; grid-template-columns: 80px 1fr auto; }
      .period-input, .ticker-input { width: 100% !important; }
      .btn-action { width: 100%; justify-content: center; }

      /* Sticky Freeze for Left Metric Column */
      thead th.metric-col, td.metric-col {
        position: sticky; left: 0; z-index: 5;
        background-color: var(--bg-surface) !important;
        box-shadow: 2px 0 5px rgba(0,0,0,0.04);
        width: 170px; min-width: 170px;
      }
      thead th.metric-col { z-index: 10; }
      tr.category-row td { position: sticky; left: 0; z-index: 4; }
      thead th.stock-col { min-width: 170px; }
      .cell-value-wrap { max-width: 100%; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon">F</div>
      <div>
        <h1 id="appTitle">Sector Fundamental Matrix</h1>
        <p id="appSubtitle">Checklist Scored &bull; Mobile & Desktop Ready</p>
      </div>
    </div>
    <button class="btn-action" id="btnThemeToggle">🌙 Dark Mode</button>
  </header>

  <!-- 5 Sector Navigation Tabs -->
  <div class="sector-nav" id="sectorNav">
    <button class="btn-tab active" data-tab="bank">Banks</button>
    <button class="btn-tab" data-tab="nbfc">NBFCs</button>
    <button class="btn-tab" data-tab="auto">Auto</button>
    <button class="btn-tab" data-tab="pharma">Pharma</button>
    <button class="btn-tab" data-tab="capgoods">Capital Goods</button>
  </div>

  <div class="controls">
    <div class="ticker-input-wrap">
      <input type="text" id="periodInput" class="period-input" placeholder="Q1 FY27" value="Q1 FY27">
      <!-- UPDATED: Clean input field -->
	  <input type="text" id="tickerInput" class="ticker-input" placeholder="TICKER...">
      <button class="btn-add" id="btnAddTicker">+ Scrape & Add</button>
    </div>
    <button class="btn-action btn-save-cloud" id="btnSaveCloud">💾 Save to Sheet</button>
    <button class="btn-action btn-load-cloud" id="btnLoadCloud">📂 Load from Sheet</button>
    <button class="btn-action" id="btnClearCurrent">🗑 Clear Table</button>
  </div>

  <div class="table-container">
    <table id="matrixTable">
      <thead>
        <tr id="headerRow">
          <th class="metric-col">Metric & Definition</th>
        </tr>
      </thead>
      <tbody id="matrixBody"></tbody>
    </table>
  </div>

  <p class="foot-text" id="sectorFootnote"></p>

  <!-- Modal Stock Selector -->
  <div class="modal-overlay" id="stockModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 id="modalTitle">Select Stocks from Cloud Sheet</h3>
        <button class="btn-remove" id="btnModalClose">&times;</button>
      </div>
      <div class="modal-actions-bar">
        <span id="modalCounter" style="font-size: 12px; color: var(--text-muted);">0 stocks available</span>
        <div style="display: flex; gap: 8px;">
          <button class="btn-link" id="btnSelectAll">Select All</button>
          <button class="btn-link" id="btnDeselectAll">Deselect All</button>
        </div>
      </div>
      <div class="stock-list-container" id="stockListContainer"></div>
      <div class="modal-footer">
        <button class="btn-action" id="btnModalCancel">Cancel</button>
        <button class="btn-action btn-load-cloud" id="btnModalImport">Import Selected</button>
      </div>
    </div>
  </div>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxLG4FObrhidjPF9oelbbyl7_zmFpq7otPJCJl2t-6WLi05GledjpOpbsVJ4yEJBnEslg/exec";

    const RATING_NAMES = ["Poor", "Average", "Good", "Excellent"];
    const RATING_CLASSES = ["r0", "r1", "r2", "r3"];

    // Reference Checklist Definitions & Thresholds
    const SECTORS = {
      bank: {
        title: "Bank Fundamental Matrix",
        sheetTab: "bank",
        val: "pb",
        valName: "P/B Ratio (x)",
        valDesc: "Judge it against ROE, not on its own",
        m: [
          { k: "roa", n: "ROA (%)", d: "u", c: [0.8, 1.2, 1.8], desc: "Profit earned on total assets" },
          { k: "roe", n: "ROE (%)", d: "u", c: [12, 15, 18], desc: "Return to shareholders" },
          { k: "gnpa", n: "Gross NPA (%)", d: "d", c: [4, 2.5, 1.5], desc: "Loans gone bad; lower is better" },
          { k: "nnpa", n: "Net NPA (%)", d: "d", c: [1.2, 0.6, 0.3], desc: "Bad loans after provisions" },
          { k: "cc", n: "Credit Cost (%)", d: "d", c: [1.5, 1, 0.5], desc: "Annual provisions as % of loans" },
          { k: "lg", n: "Loan Growth (%)", d: "u", c: [8, 12, 18], desc: "Compare with system growth" },
          { k: "dg", n: "Deposit Growth (%)", d: "u", c: [8, 10, 15], desc: "Ability to attract deposits" },
          { k: "casa", n: "CASA Ratio (%)", d: "u", c: [25, 35, 40], desc: "Lower funding cost" },
          { k: "nim", n: "NIM (%)", d: "u", c: [2.5, 3, 4], desc: "Core lending margin" },
          { k: "pcr", n: "PCR (%)", d: "u", c: [60, 70, 80], desc: "Cushion against bad loans" },
          { k: "car", n: "Capital Adequacy CRAR (%)", d: "u", c: [12, 15, 18], desc: "Financial strength" },
          { k: "cet1", n: "CET1 (%)", d: "u", c: [10, 12, 14], desc: "Core capital" },
          { k: "ci", n: "Cost-to-Income (%)", d: "d", c: [55, 45, 40], desc: "Operating efficiency" }
        ],
        foot: "Compare banks of the same peer group (PSU vs Private). Compare loan and deposit growth with RBI system growth."
      },
      nbfc: {
        title: "NBFC Fundamental Matrix",
        sheetTab: "nbfc",
        val: "pb",
        valName: "P/B Ratio (x)",
        valDesc: "Judge it against ROE, not on its own",
        m: [
          { k: "roa", n: "ROA (%)", d: "u", c: [1.5, 2.5, 3.5], desc: "Profit earned on total assets" },
          { k: "roe", n: "ROE (%)", d: "u", c: [10, 14, 18], desc: "Return to shareholders" },
          { k: "gs3", n: "Gross Stage 3 (%)", d: "d", c: [5, 3, 1.5], desc: "Loans gone bad; lower is better" },
          { k: "ns3", n: "Net Stage 3 (%)", d: "d", c: [2, 1, 0.5], desc: "Bad loans after provisions" },
          { k: "pcr", n: "Stage 3 Coverage PCR (%)", d: "u", c: [35, 50, 65], desc: "Cushion against bad loans" },
          { k: "cc", n: "Credit Cost (%)", d: "d", c: [2.5, 1.5, 0.75], desc: "Annual provisions as % of loans" },
          { k: "aum", n: "AUM Growth (%)", d: "u", c: [12, 18, 25], desc: "Growth in lending business" },
          { k: "nim", n: "NIM / Spread (%)", d: "u", c: [3, 5, 8], desc: "Varies significantly by asset segment" },
          { k: "ci", n: "Cost-to-Income (%)", d: "d", c: [50, 40, 30], desc: "Operating efficiency" },
          { k: "car", n: "CRAR (%)", d: "u", c: [17, 20, 25], desc: "Capital cushion against shocks" },
          { k: "de", n: "Debt to Equity (x)", d: "d", c: [6, 4.5, 3], desc: "Leverage; lower is safer" }
        ],
        foot: "NBFC cutoffs differ by segment (housing, vehicle, gold, microfinance). Judge NIM and leverage against identical segments."
      },
      auto: {
        title: "Auto & Ancillaries Matrix",
        sheetTab: "auto",
        val: "pe",
        valName: "P/E Ratio (x)",
        valDesc: "Compare against stock's own history and industry cyclicality",
        m: [
          { k: "roce", n: "ROCE (%)", d: "u", c: [10, 15, 20], desc: "Return on capital employed" },
          { k: "ebitda", n: "EBITDA Margin (%)", d: "u", c: [8, 11, 14], desc: "Operating profitability; swings with operating leverage" },
          { k: "revg", n: "Revenue Growth (%)", d: "u", c: [5, 10, 15], desc: "YoY top-line expansion" },
          { k: "volg", n: "Volume Growth (%)", d: "u", c: [0, 5, 10], desc: "YoY unit sales vs SIAM industry benchmark" },
          { k: "rm", n: "RM Cost (% of Sales)", d: "d", c: [70, 65, 60], desc: "Raw material cost; lower is better" },
          { k: "nde", n: "Net Debt / EBITDA (x)", d: "d", c: [2, 1, 0.5], desc: "Leverage; lower is safer; top OEMs are net cash" },
          { k: "wcd", n: "Working Capital Days", d: "d", c: [60, 40, 20], desc: "Cash conversion cycle; lower is better" },
          { k: "disc", n: "Discount (% of ASP)", d: "d", c: [5, 3, 1.5], desc: "Dealer discounting; rising discounts signal demand fatigue" },
          { k: "evmix", n: "EV Mix (%)", d: "u", c: [2, 5, 10], desc: "Share of electric vehicles in total volumes" }
        ],
        flags: [
          { k: "mktsh", n: "Market Share Trend", d: "Gaining / stable / losing share in key product lines" },
          { k: "launch", n: "New Launch Pipeline", d: "Upcoming model refresh and expected volume traction" },
          { k: "export", n: "Export Exposure", d: "Geographic diversification and FX exposure" }
        ],
        foot: "Compare OEMs against same-segment peers (2W / PV / CV / Tractors). Monitor monthly SIAM dispatch figures."
      },
      pharma: {
        title: "Pharmaceuticals Matrix",
        sheetTab: "pharma",
        val: "pe",
        valName: "P/E Ratio (x)",
        valDesc: "Compare against stock's own history and pipeline visibility",
        m: [
          { k: "roe", n: "ROE (%)", d: "u", c: [12, 16, 20], desc: "Return to shareholders" },
          { k: "ebitda", n: "EBITDA Margin (%)", d: "u", c: [15, 20, 25], desc: "Core operating profitability" },
          { k: "gm", n: "Gross Margin (%)", d: "u", c: [55, 60, 65], desc: "First hit by price erosion or RM API cost swings" },
          { k: "revg", n: "Revenue Growth (%)", d: "u", c: [5, 10, 15], desc: "YoY top-line growth" },
          { k: "rnd", n: "R&D Spend (% of Sales)", d: "u", c: [3, 5, 8], desc: "Judge alongside actual ANDA approvals, not spend alone" },
          { k: "nde", n: "Net Debt / EBITDA (x)", d: "d", c: [2, 1, 0.3], desc: "Leverage; lower is safer" },
          { k: "wcd", n: "Working Capital Days", d: "d", c: [120, 90, 60], desc: "Lower is better; pharma supply chains require cushion" },
          { k: "perosion", n: "US Price Erosion (%)", d: "d", c: [10, 5, 2], desc: "US generic business price deflation" }
        ],
        flags: [
          { k: "fda", n: "USFDA Plant Status", d: "Warning Letter / Import Alert / OAI / VAI / EIR Clear" },
          { k: "litig", n: "Litigation & One-Offs", d: "Antitrust settlements or one-time milestone royalties" },
          { k: "anda", n: "ANDA / Pipeline", d: "Filed, pending, tentative approvals and Para IV filings" }
        ],
        foot: "Check facility-wise USFDA inspection status before relying solely on score. Separate base earnings from one-off litigation gains."
      },
      capgoods: {
        title: "Capital Goods & Infra Matrix",
        sheetTab: "capitalgoods",
        val: "pe",
        valName: "P/E Ratio (x)",
        valDesc: "Compare with order pipeline and infra capex cycle",
        m: [
          { k: "roce", n: "ROCE (%)", d: "u", c: [12, 16, 20], desc: "Return on capital employed" },
          { k: "ebitda", n: "EBITDA Margin (%)", d: "u", c: [8, 12, 16], desc: "Operating margin on executed orders" },
          { k: "obs", n: "Order Book / Sales (x)", d: "u", c: [1.5, 2.5, 3.5], desc: "Revenue visibility; total executable book / sales" },
          { k: "oig", n: "Order Inflow Growth (%)", d: "u", c: [5, 12, 20], desc: "YoY expansion in fresh order intake" },
          { k: "revg", n: "Revenue Growth (%)", d: "u", c: [5, 10, 15], desc: "Execution speed and revenue recognized YoY" },
          { k: "recd", n: "Receivable Days", d: "d", c: [120, 90, 60], desc: "Lower is better; PSUs/Govt agencies typically delay payments" },
          { k: "wcd", n: "Working Capital Days", d: "d", c: [150, 100, 60], desc: "Cash trapped in WIP, inventory, and retention money" },
          { k: "nde", n: "Net Debt / EBITDA (x)", d: "d", c: [2, 1, 0.3], desc: "Leverage; lower is safer" },
          { k: "rm", n: "RM Cost (% of Sales)", d: "d", c: [65, 60, 55], desc: "Input commodities (steel, copper); lower is better" }
        ],
        flags: [
          { k: "clientconc", n: "Client Concentration", d: "Exposure to top 3 clients or single ministry (Railways/Power)" },
          { k: "govt", n: "Govt Capex Dependency", d: "Share of order book tied directly to budgetary allocations" },
          { k: "exec", n: "Execution Track Record", d: "Track record of LD (liquidated damages) and cost overruns" }
        ],
        foot: "Order book/sales and order inflow growth matter more than trailing revenue — they show future billings."
      }
    };

    let currentTab = "bank";
    let store = { bank: [], nbfc: [], auto: [], pharma: [], capgoods: [] };

    // Theme Management
    const themeBtn = document.getElementById("btnThemeToggle");
    const currentTheme = localStorage.getItem("sect_matrix_theme") || "light";
    document.documentElement.setAttribute("data-theme", currentTheme);
    themeBtn.innerHTML = currentTheme === "light" ? "🌙 Dark Mode" : "☀️ Light Mode";

    themeBtn.addEventListener("click", () => {
      const active = document.documentElement.getAttribute("data-theme");
      const next = active === "light" ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("sect_matrix_theme", next);
      themeBtn.innerHTML = next === "light" ? "🌙 Dark Mode" : "☀️ Light Mode";
    });

    // Reference Rating Logic: 0 (Poor), 1 (Average), 2 (Good), 3 (Excellent)
    function rateMetric(metricCfg, val) {
      if (val === undefined || val === null || val === "" || isNaN(val)) return -1;
      const x = parseFloat(val);
      const [c0, c1, c2] = metricCfg.c;
      if (metricCfg.d === "u") {
        return x < c0 ? 0 : (x < c1 ? 1 : (x < c2 ? 2 : 3));
      } else {
        return x > c0 ? 0 : (x > c1 ? 1 : (x > c2 ? 2 : 3));
      }
    }

    // Exact Score & Verdict Formula from Reference Checklist
    function computeStockHealth(secCfg, stock) {
      let filledCount = 0;
      let totalPts = 0;
      let poorCount = 0;

      secCfg.m.forEach(m => {
        const val = stock.v[m.k];
        const r = rateMetric(m, val);
        if (r >= 0) {
          filledCount++;
          totalPts += r;
          if (r === 0) poorCount++;
        }
      });

      // Composite Checklist Score = round( (points / (3 * filled)) * 100 )
      const score = filledCount > 0 ? Math.round((totalPts / (3 * filledCount)) * 100) : null;
      
      let verdict = "";
      let verdictClass = "";

      if (filledCount < Math.ceil(secCfg.m.length * 0.4)) {
        verdict = "Fill more rows";
        verdictClass = "vd-fill";
      } else if (score >= 75) {
        verdict = "Strong";
        verdictClass = "vd-strong";
      } else if (score >= 55) {
        verdict = "Decent";
        verdictClass = "vd-decent";
      } else if (score >= 35) {
        verdict = "Mixed";
        verdictClass = "vd-mixed";
      } else {
        verdict = "Weak";
        verdictClass = "vd-weak";
      }

      return { score, filledCount, totalRows: secCfg.m.length, poorCount, verdict, verdictClass };
    }

    function renderTable() {
      const cfg = SECTORS[currentTab];
      const list = store[currentTab];

      document.getElementById("appTitle").innerText = cfg.title;
      document.getElementById("sectorFootnote").innerText = cfg.foot;

      const headerRow = document.getElementById("headerRow");
      const tbody = document.getElementById("matrixBody");

      if (list.length === 0) {
        headerRow.innerHTML = '<th class="metric-col">Metric & Definition</th><th>Status</th>';
        tbody.innerHTML = `
          <tr>
            <td colspan="2" style="text-align: center; padding: 48px 16px; color: var(--text-dim); font-size: 13px;">
              No ${cfg.title.split(" ")[0]} stocks loaded. Use <strong>+ Scrape & Add</strong> above or import from sheet using <strong>Load from Sheet</strong>.
            </td>
          </tr>
        `;
        return;
      }

      // Compute & Sort Left to Right by Score
      list.forEach(s => { s.health = computeStockHealth(cfg, s); });
      list.sort((a, b) => (b.health.score || 0) - (a.health.score || 0));

      headerRow.innerHTML = '<th class="metric-col">Metric & Definition</th>';
      list.forEach((s, idx) => {
        const rankClass = idx === 0 ? "rank-first" : "";
        const rankLabel = idx === 0 ? "#1 LEADER" : `#${idx + 1}`;
        const th = document.createElement("th");
        th.className = "stock-col";
        th.innerHTML = `
          <div class="stock-header-wrap">
            <div class="stock-meta">
              <span class="rank-tag ${rankClass}">${rankLabel}</span>
              <div>
                <span class="stock-symbol">${s.name}</span>
                <span class="stock-period">${s.period || ""}</span>
              </div>
            </div>
            <button class="btn-remove" onclick="removeStock(${idx})">&times;</button>
          </div>
        `;
        headerRow.appendChild(th);
      });

      tbody.innerHTML = "";

      // 1. Composite Score & Verdict Summary Row
      const scoreRow = document.createElement("tr");
      scoreRow.className = "summary-row";
      scoreRow.innerHTML = `<td class="metric-col"><strong>Overall Score & Verdict</strong><div class="metric-desc">Checklist Composite (0-100)</div></td>`;
      list.forEach(s => {
        scoreRow.innerHTML += `
          <td class="stock-col">
            <div class="score-badge">${s.health.score !== null ? s.health.score + ' / 100' : '-'}</div>
            <div class="verdict-tag ${s.health.verdictClass}">${s.health.verdict} (${s.health.poorCount} Poor)</div>
          </td>
        `;
      });
      tbody.appendChild(scoreRow);

      // 2. Scored Fundamentals Category
      const catRow = document.createElement("tr");
      catRow.className = "category-row";
      catRow.innerHTML = `<td colspan="${list.length + 1}">Scored Fundamentals (${cfg.m.length} Metrics)</td>`;
      tbody.appendChild(catRow);

      cfg.m.forEach(m => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td class="metric-col">
            ${m.n}
            <div class="metric-desc">${m.desc}</div>
          </td>
        `;

        list.forEach(s => {
          const val = s.v[m.k];
          if (val === undefined || val === null || val === "") {
            tr.innerHTML += `<td class="stock-col"><div class="cell-value-wrap"><span class="cell-value">-</span></div></td>`;
          } else {
            const r = rateMetric(m, val);
            const pill = r >= 0 ? `<span class="badge-r ${RATING_CLASSES[r]}">${RATING_NAMES[r]}</span>` : "";
            tr.innerHTML += `
              <td class="stock-col">
                <div class="cell-value-wrap">
                  <span class="cell-value">${val}</span>
                  ${pill}
                </div>
              </td>
            `;
          }
        });
        tbody.appendChild(tr);
      });

      // 3. Valuation Section (Unscored)
      const valCatRow = document.createElement("tr");
      valCatRow.className = "category-row";
      valCatRow.innerHTML = `<td colspan="${list.length + 1}">Valuation Multiples (Not Scored)</td>`;
      tbody.appendChild(valCatRow);

      const valRow = document.createElement("tr");
      valRow.innerHTML = `
        <td class="metric-col">
          ${cfg.valName}
          <div class="metric-desc">${cfg.valDesc}</div>
        </td>
      `;
      list.forEach(s => {
        const val = s.v[cfg.val] || s.v.pb || s.v.pe || "-";
        valRow.innerHTML += `<td class="stock-col"><div class="cell-value-wrap"><span class="cell-value">${val}</span></div></td>`;
      });
      tbody.appendChild(valRow);

      // P/B Specific: Earnings Yield (ROE / P/B)
      if (cfg.val === "pb") {
        const eyRow = document.createElement("tr");
        eyRow.innerHTML = `
          <td class="metric-col">
            Earnings Yield on Price (%)
            <div class="metric-desc">Implied yield: ROE &divide; P/B</div>
          </td>
        `;
        list.forEach(s => {
          const roe = parseFloat(s.v.roe);
          const pb = parseFloat(s.v.pb || s.v.val);
          const ey = (!isNaN(roe) && !isNaN(pb) && pb > 0) ? (roe / pb).toFixed(1) + "%" : "-";
          eyRow.innerHTML += `<td class="stock-col"><div class="cell-value-wrap"><span class="cell-value">${ey}</span></div></td>`;
        });
        tbody.appendChild(eyRow);
      }

      // 4. Qualitative Flags Section (Auto, Pharma, Capital Goods)
      if (cfg.flags && cfg.flags.length > 0) {
        const flagCatRow = document.createElement("tr");
        flagCatRow.className = "category-row";
        flagCatRow.innerHTML = `<td colspan="${list.length + 1}">Qualitative Checklist Flags (Not Scored)</td>`;
        tbody.appendChild(flagCatRow);

        cfg.flags.forEach(f => {
          const fRow = document.createElement("tr");
          fRow.innerHTML = `
            <td class="metric-col">
              ${f.n}
              <div class="metric-desc">${f.d}</div>
            </td>
          `;
          list.forEach(s => {
            const flagVal = s.v[f.k] || "Clear / Stable";
            fRow.innerHTML += `
              <td class="stock-col">
                <div class="cell-value-wrap" style="max-width: 100%;">
                  <span class="cell-value" style="font-size: 11px; font-weight: 500;">${flagVal}</span>
                </div>
              </td>
            `;
          });
          tbody.appendChild(fRow);
        });
      }
    }

    // Switch Sector View
    document.querySelectorAll(".sector-nav .btn-tab").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".sector-nav .btn-tab").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentTab = btn.getAttribute("data-tab");
        renderTable();
      });
    });

    // Remove Single Stock Column
    function removeStock(idx) {
      store[currentTab].splice(idx, 1);
      renderTable();
    }

    // Clear Table Button
    document.getElementById("btnClearCurrent").addEventListener("click", () => {
      if (store[currentTab].length === 0) return;
      if (confirm(`Clear all stocks displayed in ${SECTORS[currentTab].title}?`)) {
        store[currentTab] = [];
        renderTable();
      }
    });

    // Live Scraper Integration
    async function scrapeAndAddStock(sym, period) {
      sym = sym.trim().toUpperCase();
      if (!sym) return;

      try {
        const res = await fetch(`http://127.0.0.1:8000/fetch?symbol=${sym}&type=${currentTab}`);
        if (!res.ok) throw new Error("Scrape failed");
        const json = await res.json();

        // De-duplicate in active view
        store[currentTab] = store[currentTab].filter(s => s.name !== sym);
        store[currentTab].push({
          name: sym,
          period: period || "Q1 FY27",
          v: json.v || {}
        });

        renderTable();
      } catch (err) {
        alert("bridge.py is unreachable. If you are browsing on mobile, use 'Load from Sheet' to import cloud-saved records.");
      }
    }

    document.getElementById("btnAddTicker").addEventListener("click", () => {
      const ticker = document.getElementById("tickerInput").value;
      const period = document.getElementById("periodInput").value;
      scrapeAndAddStock(ticker, period);
      document.getElementById("tickerInput").value = "";
    });

    document.getElementById("tickerInput").addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        const ticker = e.target.value;
        const period = document.getElementById("periodInput").value;
        scrapeAndAddStock(ticker, period);
        e.target.value = "";
      }
    });

    // Modal Sheet Importer
    let sheetFetchedStocks = [];

    async function openSheetPicker() {
      const cfg = SECTORS[currentTab];
      document.getElementById("modalTitle").innerText = `Select ${cfg.title.split(" ")[0]} Stocks from Sheet`;

      try {
        const res = await fetch(`${GOOGLE_SCRIPT_URL}?tab=${cfg.sheetTab}`);
        const data = await res.json();
        if (!Array.isArray(data) || data.length === 0) {
          alert(`No records found in the '${cfg.title.split(" ")[0]}' tab of your Google Sheet.`);
          return;
        }

        // NEW BULLETPROOF TIMESTAMP DEDUPLICATION:
        // Reads from bottom to top (or sorts by timestamp descending)
        const map = new Map();
        
        // Sort sheet records newest first
        data.sort((a, b) => new Date(b.timestamp || 0) - new Date(a.timestamp || 0));

        data.forEach(item => {
          if (!map.has(item.name)) {
            map.set(item.name, item); // Locks in the latest timestamp row
          }
        });

        sheetFetchedStocks = Array.from(map.values());

        const listContainer = document.getElementById("stockListContainer");
        listContainer.innerHTML = "";
        document.getElementById("modalCounter").innerText = `${sheetFetchedStocks.length} stocks available in cloud`;

        sheetFetchedStocks.forEach((item, idx) => {
          const row = document.createElement("label");
          row.className = "stock-item-row";
          row.innerHTML = `
            <input type="checkbox" class="stock-checkbox" data-idx="${idx}" checked>
            <span class="stock-symbol">${item.name}</span>
            <span class="stock-period" style="margin-left: auto;">${item.period || ""}</span>
          `;
          listContainer.appendChild(row);
        });

        document.getElementById("stockModal").style.display = "flex";
      } catch (err) {
        alert("Failed to load from Google Sheets: " + err);
      }
    }

    document.getElementById("btnLoadCloud").addEventListener("click", openSheetPicker);

    function closeModal() {
      document.getElementById("stockModal").style.display = "none";
    }
    document.getElementById("btnModalClose").addEventListener("click", closeModal);
    document.getElementById("btnModalCancel").addEventListener("click", closeModal);

    document.getElementById("btnSelectAll").addEventListener("click", () => {
      document.querySelectorAll(".stock-checkbox").forEach(cb => cb.checked = true);
    });
    document.getElementById("btnDeselectAll").addEventListener("click", () => {
      document.querySelectorAll(".stock-checkbox").forEach(cb => cb.checked = false);
    });

    document.getElementById("btnModalImport").addEventListener("click", () => {
      const selected = [];
      document.querySelectorAll(".stock-checkbox:checked").forEach(cb => {
        const idx = Number(cb.getAttribute("data-idx"));
        selected.push(sheetFetchedStocks[idx]);
      });

      if (selected.length === 0) {
        alert("Please select at least one stock to display.");
        return;
      }

      store[currentTab] = selected;
      renderTable();
      closeModal();
    });

    // Cloud Sheet Saver
    document.getElementById("btnSaveCloud").addEventListener("click", async () => {
      const cfg = SECTORS[currentTab];
      const list = store[currentTab];
      if (list.length === 0) {
        alert(`No stocks currently loaded in ${cfg.title} to save.`);
        return;
      }

      const payload = {
        tab: cfg.sheetTab,
        period: document.getElementById("periodInput").value || "Q1 FY27",
        stocks: list.map(s => ({
          name: s.name,
          v: s.v
        }))
      };

      try {
        await fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        alert(`Saved successfully to '${cfg.title.split(" ")[0]}' tab in Google Sheets!`);
      } catch (err) {
        alert("Error saving to Google Sheet: " + err);
      }
    });

    // Initial Launch in Bank Mode
    renderTable();
  </script>
</body>
</html>
